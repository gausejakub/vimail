name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Verify go.sum
        run: go mod verify

      # pkg/vimtea is a nested Go module: the root go build/vet/test
      # commands stop at its module boundary, so it gets explicit steps.
      - name: Build vimtea
        working-directory: pkg/vimtea
        run: go build ./...

      - name: Vet vimtea
        working-directory: pkg/vimtea
        run: go vet ./...

      - name: Test vimtea
        working-directory: pkg/vimtea
        run: go test ./...

      - name: Verify vimtea go.sum
        working-directory: pkg/vimtea
        run: go mod verify

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: govulncheck vimtea
        working-directory: pkg/vimtea
        run: govulncheck ./...
