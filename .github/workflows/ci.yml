name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Releases ship Windows binaries; keep them compiling. Tests are not
      # run on Windows.
      - name: Cross-compile for Windows
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=windows GOARCH=amd64 go build ./... && GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go build ./...

      - name: Verify go.sum
        run: go mod verify

      # pkg/vimtea is a nested Go module: the root go build/vet/test
      # commands stop at its module boundary, so it gets explicit steps.
      - name: Build vimtea
        working-directory: pkg/vimtea
        run: go build ./...

      - name: Vet vimtea
        working-directory: pkg/vimtea
        run: go vet ./...

      - name: Test vimtea
        working-directory: pkg/vimtea
        run: go test ./...

      - name: Verify vimtea go.sum
        working-directory: pkg/vimtea
        run: go mod verify

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: govulncheck vimtea
        working-directory: pkg/vimtea
        run: govulncheck ./...

  # The flake pins vendorHash; a go.sum change without updating it breaks
  # `nix run github:gausejakub/vimail` for users. Build it on every PR.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Build flake
        run: nix build .#vimail --print-build-logs
      - name: Smoke test
        run: ./result/bin/vimail --help
