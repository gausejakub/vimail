name: Release

# Builds the release tarballs in CI when a version tag is pushed, so the
# published binaries come from a clean, reproducible environment rather than a
# developer machine. Each release carries SHA256SUMS and signed build
# provenance (verify with `gh attestation verify <file> -R gausejakub/vimail`).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Test
        run: go vet ./... && go test ./...

      - name: Build tarballs
        env:
          CGO_ENABLED: '0'
          GOWORK: 'off'   # build exactly what `go install …@tag` builds
        run: |
          mkdir dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="vimail-$os-$arch"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "dist/$name" .
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm "dist/$name"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'dist/*.tar.gz'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          {
            echo
            echo "### Verifying a download"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify vimail-<os>-<arch>.tar.gz -R $GITHUB_REPOSITORY"
            echo '```'
          } >> notes.md
          gh release create "$TAG" --latest --title "$TAG" --notes-file notes.md dist/*.tar.gz dist/SHA256SUMS
